# Все тексты и надписи кнопок бота. Любую можно переопределить в config.toml, раздел [ui.labels].
[text]
status = """Бот Veil публикует ваши сообщения в группе — анонимно или под вашим ником.

Как опубликовать: просто напишите боту сообщение (текст, фото, видео, альбом, опрос) — появится черновик, нажмите «Отправить». Ответить или исправить свой пост: перешлите его сюда из группы.

Что нужно для публикации:
{lines}"""
status_b2b_ok = "✅ Связь с сервером есть."
status_b2b_off = "❌ Нет связи с сервером: в @BotFather → /mybots → этот бот → Bot Settings → Bot-to-Bot Communication — включите, затем пришлите /start."
status_tokens = "✅ Токенов на сегодня: {n}. Токен тратится на публикацию, правку, удаление и смену ника, только если действие выполнено."
status_tokens_none = "❌ Токенов нет — без них пост не уйдёт. Нажмите «Пополнить»: бот даст пару сообщений, их нужно переслать боту-эмитенту и вернуть его ответ сюда (до 50 токенов в день)."
status_identity = "✅ Подпись постов: {sign}. «Анонимно» в черновике — пост без подписи."
status_identity_none = "➖ Личности нет — это необязательно: посты выйдут анонимно. Ник и подпись постов: в терминале компьютера с ботом python -m veil {config} init."
status_identity_pool = "➖ Личности нет — это необязательно: посты выйдут анонимно. Для ника и подписи постов нажмите «Создать личность» (1 токен)."
status_delay = "⏱ После «Отправить» пост уходит через {lo}–{hi} с (случайно): так время поста не выдаёт, когда вы писали боту."
status_no_delay = "⏱ Пост уходит сразу после «Отправить» (случайная задержка выключена)."
status_issuer_repin = "⚠️ keys.json предлагает другой ключ эмитента, чем закреплён в боте. Если проект объявлял смену ключа, подтвердите её в терминале: python -m veil {config} pin-issuer. До подтверждения бот просит токены по прежнему ключу."
status_pool = "Бот работает на общем сервере пула: его оператор видит, кто вы и что вы пишете боту. Для анонимности и от оператора нужен свой бот на своём компьютере."
no_tokens_before = "Черновик сохранён, но отправить его не получится: токенов на сегодня нет. Пополните и нажмите «Отправить» ещё раз."
pool_identity_done = "Личность создана. Метка: {tag}."
pool_words = """12 слов восстановления — единственный способ вернуть личность или отозвать украденный бот. Запишите их на бумагу. Не фотографируйте и никому не пересылайте: это сообщение удалится, когда вы нажмёте «Я записал», или само через час.

⚠️ Слова пришли через Telegram: их видно во всех ваших сессиях и, возможно, в уведомлениях, а создал их сервер пула. Кто их увидит, тот в любой момент заберёт личность. Если это вас не устраивает — заведите бот на своём компьютере: там слова показываются только в терминале.

{words}"""
pool_words_gone = "Сообщение со словами удалено."
welcome_back = "Бот Veil готов. Ваша подпись: {sign}. /help — что умеет бот."
help = """Как пользоваться:
• Напишите сообщение (текст, фото, видео, альбом, опрос) — бот покажет черновик с кнопками.
• Перешлите боту пост из группы — появятся действия: ответить, или для своего поста — UPD, исправить, удалить.
• /tokens — сколько осталось действий и пополнение (50 в день). Токен тратится только на выполненное действие: публикацию, правку, удаление, смену ника.
• /market — маркет плагинов: каталог, установка и обновления; плагины работают в песочнице, разрешения подтверждаете вы.
• /nick — задать, сменить или убрать ник (менять можно раз в сутки). Посты с ником подписаны «Имя·метка». Кнопка «Анонимно» в черновике позволяет выпустить отдельный пост без подписи, не трогая ник.
• Восстановить личность или перенести её на другой бот — командой restore в терминале компьютера с ботом (нужны 12 слов). В Telegram 12 слов не вводятся никогда.
• Об ответах на ваши посты и о скрытых сообщениях для вас бот сообщает сам (проверяет раз в минуту).
• /plugins — плагины этого бота и их кнопки.
• /export — перенести этого бота (личность, токены, право править свои посты, настройки) в другое место; /import — принять такой перенос. В пуле /leave — отключить бота от пула."""
