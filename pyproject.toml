[project]
name = "veil-client"
version = "0.1.0.dev0"
description = "Reference Veil bot: anonymous posting to a Telegram group through your own bot"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "pynacl>=1.6.2",    # Ed25519, X25519, sealed box; 1.5.0–1.6.1 — CVE-2025-69277 во вшитой libsodium
  "regex>=2024.0",    # \X — подсчёт графем в никах
  "httpx>=0.28",      # асинхронный Bot API, прокси
  "socksio>=1.0",     # прокси socks5:// для httpx (config: telegram.proxy)
  "h11>=0.16",        # транзитивно через httpx: до 0.16 — CVE-2025-43859
  "idna>=3.15",       # транзитивно через httpx: до 3.15 — CVE-2026-45409
  "mnemonic==0.21",   # BIP-39: эталонная реализация Trezor (python-mnemonic), версия закреплена
  "wasmtime==50.0.1", # движок плагинов (docs/PLUGINS.md): версия закреплена — от неё зависит формат
                      # скомпилированного движка (.cwasm) и ABI компонентной модели
]
# Точные версии и хеши — requirements.lock (pip-compile --generate-hashes); установка:
#   pip install --require-hashes -r requirements.lock && pip install --no-deps .

[project.scripts]
veil-bot = "veil.__main__:run"
# Системное требование: libsodium >= 1.0.21 (или пакет дистрибутива с исправлением CVE-2025-69277); через него и Argon2id метки;
# ristretto255 для токенов вызывается через ctypes. Со старой версией клиент работает, но предупреждает.

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "mutmut>=3.8"]

[tool.setuptools.packages.find]
include = ["veil*"]   # locales/ — рядом с пакетом, приложение запускается из каталога исходников

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120   # PEP 8 разрешает договориться о длине строки; в проекте — 120

[tool.ruff.lint]
# Те же правила запускают проверки проекта. E, W, N, I — PEP 8: стиль, пробелы, имена, порядок импортов.
# RUF006 — задача asyncio без ссылки (её может собрать сборщик мусора), RUF021 — and/or без скобок,
# PLC0415 — импорт внутри функции только с пометкой причины (noqa).
select = ["F", "E", "W", "N", "I", "B", "S", "BLE", "RUF006", "RUF021", "PLC0415"]
# S105/S107 — коды ошибок со словом TOKEN, S311 — random не для криптографии, B905 — длины сверены раньше,
# BLE001 — широкий except там, где один сбой не должен ронять цикл (каждый помечен).
ignore = ["S101", "B905", "BLE001", "S311", "S105", "S107"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "PLC0415"]

# Границы модулей (docs/ARCHITECTURE.md, «Границы модулей»). Проверка: lint-imports --no-cache, в воротах.
# Правила — разрешающие: новый модуль или связь сначала вносятся сюда и в документ.
[tool.importlinter]
root_package = "veil"
include_external_packages = true

[[tool.importlinter.contracts]]
id = "layers"
name = "Слои бота: вызовы только сверху вниз"
type = "layers"
layers = [
  "veil.pool",
  "veil.__main__ | veil.plugin_dev | veil.market_tool",
  "veil.ui | veil.cli",
  "veil.market | veil.plugin_engine",
  "veil.plugins",
  "veil.plugin_manifest | veil.plugin_host",
  "veil.sandbox | veil.seccomp",
  "veil.core",
]

[[tool.importlinter.contracts]]
id = "core-layers"
name = "Слои ядра: протокол и криптография внизу, api наверху"
type = "layers"
containers = ["veil.core"]
layers = ["api", "export | privacy | transport | store", "wallet | identity", "crypto", "protocol"]

[[tool.importlinter.contracts]]
id = "ui-api"
name = "Интерфейс — только через veil.core.api и veil.core.export"
type = "forbidden"
source_modules = ["veil.ui"]
forbidden_modules = ["veil.core.protocol", "veil.core.crypto", "veil.core.identity", "veil.core.store",
                     "veil.core.transport", "veil.core.wallet", "veil.core.privacy", "nacl", "httpx", "sqlite3"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "no-words"
name = "12 слов не попадают в код бота"
type = "forbidden"
source_modules = ["veil.ui", "veil.core.api", "veil.core.export", "veil.plugins", "veil.plugin_engine",
                  "veil.plugin_host", "veil.plugin_manifest", "veil.market"]
forbidden_modules = ["veil.core.crypto.bip39", "veil.cli", "mnemonic"]

[[tool.importlinter.contracts]]
id = "plugins-no-core"
name = "Плагины и движок не видят ядро"
type = "forbidden"
source_modules = ["veil.plugins", "veil.plugin_engine", "veil.plugin_manifest", "veil.plugin_host",
                  "veil.sandbox", "veil.seccomp"]
forbidden_modules = ["veil.core", "veil.ui", "nacl", "sqlite3"]

[[tool.importlinter.contracts]]
id = "host-pure"
name = "Процесс-хост движка: без сети и без кода бота"
type = "forbidden"
source_modules = ["veil.plugin_host", "veil.sandbox", "veil.seccomp"]
forbidden_modules = ["veil.plugins", "veil.plugin_engine", "veil.plugin_manifest", "veil.market", "httpx"]

[[tool.importlinter.contracts]]
id = "host-entry"
name = "Процесс-хост и wasmtime — только через plugin_engine"
type = "forbidden"
source_modules = ["veil.core", "veil.ui", "veil.cli", "veil.plugins", "veil.plugin_manifest", "veil.market",
                  "veil.market_tool", "veil.pool", "veil.__main__", "veil.plugin_dev", "veil.sandbox", "veil.seccomp"]
forbidden_modules = ["veil.plugin_host", "wasmtime"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "market-pure"
name = "Маркет: из ядра только протокол и криптография"
type = "forbidden"
source_modules = ["veil.market", "veil.market_tool"]
forbidden_modules = ["veil.core.api", "veil.core.export", "veil.core.privacy", "veil.core.store",
                     "veil.core.transport", "veil.core.wallet", "veil.core.identity", "sqlite3"]

[[tool.importlinter.contracts]]
id = "core-io"
name = "Ядро: Telegram — только transport"
type = "forbidden"
source_modules = ["veil.core.protocol", "veil.core.crypto", "veil.core.identity", "veil.core.wallet",
                  "veil.core.store", "veil.core.privacy", "veil.core.export"]
forbidden_modules = ["httpx", "wasmtime"]

[[tool.importlinter.contracts]]
id = "sqlite-store"
name = "sqlite3 — только veil.core.store"
type = "forbidden"
source_modules = ["veil.core.protocol", "veil.core.crypto", "veil.core.identity", "veil.core.wallet",
                  "veil.core.transport", "veil.core.privacy", "veil.core.export", "veil.core.api"]
forbidden_modules = ["sqlite3"]
allow_indirect_imports = true
